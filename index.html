.wrap{max-width:none;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;font-weight:600}
h1{margin:4px 0 2px;font-size:26px;font-weight:700;letter-spacing:-.02em}
.sub{opacity:.8;font-size:13px}
.pill{font:inherit;color:inherit;display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,currentColor 14%,transparent);border:1px solid color-mix(in srgb,currentColor 25%,transparent);padding:5px 11px;border-radius:99px;font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;background:#4ADE80}.dot.off{background:#FBBF24}
main{margin-top:20px;padding:0 20px 40px}
.grid{display:grid;gap:14px}
.kpi{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(15,27,45,.04),0 8px 24px -12px rgba(15,27,45,.12)}
.k-l{color:var(--mut);font-size:12px;font-weight:500}.k-v{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:2px}.k-n{font-size:12px;color:var(--mut)}
h2{font-size:15px;margin:26px 0 10px;font-weight:600}
.subs{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.sc{cursor:pointer;border-top:4px solid var(--c);transition:transform .15s,box-shadow .15s}.sc:hover{transform:translateY(-2px)}
.sc.on{outline:2px solid var(--c)}
.sc b{font-size:14px}.sc .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.sc .big{font-size:24px;font-weight:700;color:var(--c)}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c,var(--acc));border-radius:99px}
.meta{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--mut)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
.tools input{flex:1;min-width:200px;width:auto}.tools select{width:auto}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;background:var(--btn);color:var(--btnt)}
.btn.g{background:var(--soft);color:var(--ink)}.btn.d{background:var(--lateb);color:var(--late)}

.tw{overflow-x:auto;padding:0}
table{width:100%;border-collapse:collapse;min-width:1160px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);text-align:left;padding:12px 14px;background:var(--soft);font-weight:600}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}
tr:hover td{background:var(--soft)}
.nm{font-weight:600}.due{font-size:12px;color:var(--mut)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.sb{background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.st-on{background:var(--onb);color:var(--on)}.st-risk{background:var(--riskb);color:var(--risk)}.st-late{background:var(--lateb);color:var(--late)}.st-done{background:var(--doneb);color:var(--done)}
.pg{display:flex;align-items:center;gap:8px;min-width:130px}.pg .bar{flex:1}.pg span{font-weight:600;font-size:12px;width:34px;text-align:right}
.iss{max-width:260px;font-size:13px}.iss.none{color:var(--mut)}
.pic{display:flex;align-items:center;gap:8px;white-space:nowrap}
.av{width:26px;height:26px;border-radius:50%;background:var(--btn);color:var(--btnt);display:grid;place-items:center;font-size:11px;font-weight:700}
.empty{padding:40px;text-align:center;color:var(--mut)}
dialog{border:1px solid var(--line);border-radius:16px;padding:0;width:min(640px,calc(100% - 24px));background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(8,20,40,.55)}
.mh{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px}
.mb{padding:16px 20px;display:grid;gap:12px}.mb label{font-size:12px;font-weight:600;color:var(--mut);display:grid;gap:5px}
.r3{display:grid;grid-template-columns:1fr 2fr 1.2fr;gap:8px}.r3 select{min-width:0}.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.note{font-size:12px;color:var(--mut);margin-top:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;display:none}
.th{position:relative}.pop{position:absolute;right:0;top:calc(100% + 8px);z-index:20;width:268px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 16px 40px -12px rgba(0,0,0,.4);display:none}
.pop.open{display:block}.pop h3{margin:0 0 10px;font-size:13px}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw button{border:3px solid transparent;border-radius:10px;height:42px;cursor:pointer;background:var(--c)}
.sw button.on{border-color:var(--ink)}
.cu{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:12px;color:var(--mut);gap:8px}
.cu input{width:56px;height:34px;padding:2px;cursor:pointer}
.brand{display:flex;align-items:center;gap:14px}.logo-img{height:68px;width:auto;display:block}
.logo{height:48px;min-width:56px;border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;overflow:hidden;background:#fff;color:var(--mut);font-size:11px;font-weight:600;padding:0 10px}
.logo.ed{cursor:pointer}.logo img{height:48px;max-width:170px;object-fit:contain;display:block}.logo:has(img){border:0;padding:0}
.bt b{display:block;font-size:21px;line-height:1.2;letter-spacing:-.01em}.bt span{font-size:16px;color:var(--mut);font-weight:500}.ttl{text-align:center;flex:1}
.kpi .card{border-top:3px solid var(--p)}
.seg{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.seg button{font:inherit;font-weight:600;font-size:13px;white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:99px;padding:7px 14px;cursor:pointer;display:flex;gap:8px;align-items:center}
.seg button i{font-style:normal;font-size:11px;background:var(--soft);border-radius:99px;padding:1px 7px;color:var(--mut)}
.seg button.on{background:var(--btn);color:var(--btnt);border-color:transparent}.seg button.on i{background:rgba(255,255,255,.25);color:inherit}
.dt{width:8px;height:8px;border-radius:50%;background:var(--c)}
.dd{white-space:nowrap}.dd b{font-weight:600}.dd div{font-size:11px;font-weight:600}.dd.over b,.dd.over div{color:var(--late)}.dd.soon div{color:var(--risk)}
html{height:100%}
body{height:100%;display:flex;flex-direction:column;overflow:hidden;font-size:15px}
header .top{flex-wrap:nowrap}.ttl h1{margin:0;font-size:24px}.ttl .sub{font-size:clamp(15px,1.3vw,20px);font-weight:600;margin:2px 0 0;opacity:.9}
main{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:0;padding:14px var(--gx) 10px}
main>.wrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;width:100%}
.band{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;flex:none}
.band .kpi{grid-template-columns:repeat(4,minmax(0,1fr))}.band .subs{grid-template-columns:repeat(3,minmax(0,1fr))}
.band .card{padding:12px 14px}.band .k-v{font-size:26px}
.lst{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.bar2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex:none}
.bar2 .seg{margin:0;padding:0;overflow:visible;flex-wrap:wrap}
.bar2 .tools{margin:0;flex:1;justify-content:flex-end;flex-wrap:wrap}
.bar2 .tools input{max-width:300px;min-width:140px}
.lst .tw{flex:1;min-height:0;overflow:auto}
th{position:sticky;top:0;z-index:2;font-size:12px}td{padding:11px 14px;font-size:15px}
.note{flex:none;margin:0;font-size:12px}
.r2{align-items:start}
.logo-img{height:clamp(46px,6vh,68px)}.bt b{font-size:clamp(17px,1.35vw,21px)}.bt span{font-size:clamp(13px,1vw,16px)}
.ttl h1{font-size:clamp(18px,1.6vw,24px);white-space:nowrap}
.band .k-l,.band .k-n{font-size:11.5px}.band .k-v{font-size:24px}
.sc b{font-size:13px}.meta{gap:8px;font-size:11px;white-space:nowrap}
.seg button{font-size:12.5px;padding:6px 11px}
.bar2 .tools{flex-wrap:nowrap;align-items:center}.bar2 .tools input{flex:1 1 120px;min-width:100px}.bar2 .tools .btn{white-space:nowrap;padding:8px 14px;font-size:13px}
.dm{position:relative}.dm .pop{width:210px;padding:10px}.dm .pop .btn{display:block;width:100%;text-align:left;margin-bottom:6px}.dm .pop .btn:last-child{margin-bottom:0}
@media(max-height:820px){td{padding:7px 14px}th{padding:8px 14px}.band .card{padding:9px 12px}main{padding-top:10px}main>.wrap{gap:8px}}
.tag.mn{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.av{width:34px;height:34px;font-size:12px;object-fit:cover}.pr{display:flex;align-items:center;gap:12px}.pr .hl{font-size:12px;font-weight:600;color:var(--mut);margin-bottom:6px}.pr .btn{padding:6px 12px;font-size:12px}
@media(max-width:1200px){.band{grid-template-columns:1fr}}
@media(max-width:800px){:root{--gx:12px}html,body{height:auto}body{overflow:auto;display:block}main{display:block;padding:12px}main>.wrap{display:block}.lst{display:block}.band{margin-bottom:12px}header .top{flex-wrap:wrap}.ttl{text-align:left;flex-basis:100%;order:3}.lst .tw{overflow-x:auto}}
@media(max-width:560px){h1{font-size:22px}.r2{grid-template-columns:1fr}}
@media(max-width:700px){
.band .kpi{grid-template-columns:repeat(2,minmax(0,1fr))}.band .subs{grid-template-columns:repeat(3,minmax(0,1fr))}.sc .meta{display:none}.sc b{font-size:11px}.sc .big{font-size:18px}.sc .row{flex-direction:column;align-items:flex-start;margin:0}.ttl h1{white-space:normal;font-size:18px}.band .k-v{font-size:22px}
.bar2 .tools{flex-wrap:wrap}.bar2 .tools input{flex:1 1 100%;max-width:none}
.lst .tw{overflow:visible;border:0;box-shadow:none;background:transparent}
table{min-width:0;display:block}thead{display:none}tbody{display:block}
tr{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px}
td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:5px 0;background:transparent!important;text-align:right}
td::before{font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;flex:none;text-align:left}
td:nth-child(1)::before{content:"Pekerjaan Utama"}td:nth-child(2)::before{content:"Nama Pekerjaan"}td:nth-child(3)::before{content:"Sub Bidang"}td:nth-child(4)::before{content:"PIC"}td:nth-child(5)::before{content:"Progress"}td:nth-child(6)::before{content:"Status"}td:nth-child(7)::before{content:"Tanggal Mulai"}td:nth-child(8)::before{content:"Due Date"}td:nth-child(9)::before{content:"Issue"}
td:nth-child(10)::before{display:none}td:nth-child(10){justify-content:flex-end}
.pg{min-width:0;flex:1;max-width:60%}.iss{max-width:none}main{padding:10px}
}
.hl2{font-size:12px;color:var(--mut);margin-top:-6px}.mb label.ck{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:13px;font-weight:500}.ck input{width:auto}.em{color:var(--mut);font-size:12px;margin-left:4px}
</style>

<script>

const SC={"On Track":"on","Berisiko":"risk","Terlambat":"late","Selesai":"done"};

["Penyusunan RKAP Perencanaan 2027",0,"Andi P.",65,"On Track","","2026-11-15"],

["Evaluasi Kinerja Triwulan III",0,"Andi P.",100,"Selesai","","2026-10-05"],
["Review Desain Pondasi Tower",1,"Budi H.",55,"On Track","","2026-11-20"],
["Kajian Geoteknik Segmen Rawa",1,"Rina A.",30,"Terlambat","Hasil uji tanah dari konsultan tertunda 3 minggu","2026-10-18"],
["Verifikasi BQ Pekerjaan Sipil Gardu Induk",1,"Budi H.",80,"On Track","","2026-10-28"],
["Review Desain Konduktor dan Isolator",2,"Dimas R.",70,"On Track","","2026-11-05"],
["Penyusunan Spesifikasi Teknis Bay Line",2,"Maya S.",45,"Berisiko","Menunggu keputusan standar proteksi dari pusat","2026-11-12"],
["Evaluasi Single Line Diagram Gardu Induk",2,"Dimas R.",25,"On Track","","2026-12-01"]
].map(a=>({name:a[0],sub:SUBS[a[1]],pic:a[2],prog:a[3],st:a[4],issue:a[5],due:a[6],upd:"2026-10-12"}));
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let jobs=[],db=null,canWrite=true,loaded=false,fsub="Semua",editId=null,lid=0;
function normDue(v){
 if(v==null||v==="")return"";
 const loc=d=>isNaN(d)?"":new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
 if(typeof v==="number")return loc(new Date(Math.round((v-25569)*864e5)+new Date().getTimezoneOffset()*6e4));
 const s=String(v).trim();let m;
 if(/^\d{5,6}(\.\d+)?$/.test(s))return normDue(Number(s));
 if(/^\d{4}-\d{1,2}-\d{1,2}T.*Z$/.test(s))return loc(new Date(s));
 if(m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s))return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
 if(m=/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/.exec(s))return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
 return loc(new Date(s));
}
const fmt=d=>{const x=d?new Date(d+"T00:00:00"):null;return x&&!isNaN(x)?x.toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"}):"-"};
const ini=n=>n.split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase();
const avg=a=>a.length?Math.round(a.reduce((s,j)=>s+j.prog,0)/a.length):0;
const open=j=>j.issue&&j.st!=="Selesai";
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",2600)}
const todayS=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
function dueCell(j){let sub="",c="";if(j.due&&j.st!=="Selesai"){const n=Math.round((new Date(j.due+"T00:00:00")-new Date(todayS()+"T00:00:00"))/864e5);if(n<0){c=" over";sub="Lewat "+(-n)+" hari"}else if(n<=7){c=" soon";sub=n===0?"Hari ini":n+" hari lagi"}}return `<td class="dd${c}"><b>${fmt(j.due)}</b>${sub?`<div>${sub}</div>`:""}</td>`}
function render(){
 const L=jobs,o=L.filter(open).length,r=L.filter(j=>j.st==="Terlambat"||j.st==="Berisiko").length;
 $("kpi").innerHTML=[["Total Pekerjaan",L.length,"di 3 sub bidang"],["Rata-rata Progress",avg(L)+"%","seluruh pekerjaan"],["Pekerjaan Selesai",L.filter(j=>j.st==="Selesai").length,"dari "+L.length+" pekerjaan"],["Issue Terbuka",o,r+" berisiko / terlambat"]]
 .map(k=>`<div class="card"><div class="k-l">${k[0]}</div><div class="k-v">${k[1]}</div><div class="k-n">${k[2]}</div></div>`).join("");
 $("subs").innerHTML=SUBS.map((s,i)=>{const a=L.filter(j=>j.sub===s);return `<div class="card sc ${fsub===s?"on":""}" style="--c:${COL[i]}" data-act="sub" data-v="${s}"><div class="row"><b>${s}</b><span class="big">${avg(a)}%</span></div><div class="bar"><i style="width:${avg(a)}%"></i></div><div class="meta"><span>${a.length} pekerjaan</span><span>${a.filter(open).length} issue</span><span>${a.filter(j=>j.st==="Selesai").length} selesai</span></div></div>`}).join("");
 $("seg").innerHTML=[["Semua",-1]].concat(SUBS.map((s,i)=>[s,i])).map(([s,i])=>`<button class="${fsub===s?"on":""}" data-act="subset" data-v="${s}">${i>=0?`<span class="dt" style="--c:${COL[i]}"></span>`:""}${s==="Semua"?"Semua Sub Bidang":s}<i>${s==="Semua"?L.length:L.filter(j=>j.sub===s).length}</i></button>`).join("");

const PRE=[["Biru Korporat","#0B3C6D"],["Teal","#0F766E"],["Hijau","#15803D"],["Merah Marun","#9F1239"],["Ungu","#5B21B6"],["Oranye","#C2410C"],["Kuning Emas","#F5B301"],["Slate","#1E293B"]],DEF="#0B3C6D";
function hsl(x){const n=parseInt(x.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,l=(mx+mn)/2,s=d?d/(1-Math.abs(2*l-1)):0;let h=0;if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h=Math.round(h*60);if(h<0)h+=360}return{h,s:s*100,l:l*100}}
function lum(x){const n=parseInt(x.slice(1),16);return[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0)}
function applyTheme(hex,save){
 if(!/^#[0-9a-f]{6}$/i.test(hex))hex=DEF;
 const c=hsl(hex),light=lum(hex)>.4,s=document.documentElement.style,ink=light?"#0F1B2D":"#fff";
 s.setProperty("--p",hex);s.setProperty("--h",c.h);
 s.setProperty("--a","hsl("+((c.h+30)%360)+" "+Math.max(55,Math.round(c.s))+"% "+Math.min(55,Math.max(40,Math.round(c.l)+8))+"%)");
 s.setProperty("--acc","var(--a)");
 s.setProperty("--g0",light?"color-mix(in srgb,"+hex+" 80%,#fff)":"color-mix(in srgb,"+hex+" 55%,#000)");
 s.setProperty("--hd",ink);s.setProperty("--onp",ink);
 $("cc").value=hex.toLowerCase();
 let nm="Kustom";document.querySelectorAll("#sw button").forEach(b=>{const on=b.dataset.t.toLowerCase()===hex.toLowerCase();b.classList.toggle("on",on);if(on)nm=b.title});
 $("thn").textContent="Aktif: "+nm;
 if(save){try{localStorage.setItem("dash-theme",hex)}catch(e){}}
}

const API="https://script.google.com/macros/s/AKfycbzHNT711kBviyFnSxvqA92DcbMFCsp8GZyyJCIgolSiS5J75CVoYnC4Qfvv7jbZHqzs/exec",K="dash-sheet-v2";
let rows=[],pending=0,fetching=false,hadCache=false,pics={},xtra={};
try{const s=JSON.parse(localStorage.getItem(K)||"null");if(s&&Array.isArray(s.rows)){rows=s.rows;pics=s.pics||{};hadCache=true}}catch(e){}
function diag(m){$("note").textContent="⚠ "+m;$("note").style.color="var(--late)"}
function warnV(v){diag("Web App ...("+API.split("/s/")[1].split("/")[0].slice(-8)+") menjawab dengan kode "+(v?"versi "+v:"lama tanpa nomor versi")+", padahal dibutuhkan versi 4. Simpan Code.gs, lalu Deploy sebagai Versi baru.")}
const MM={sent:"Email notifikasi terkirim ke PIC.",email_pic_belum_ada:"Tersimpan, tetapi PIC belum punya email.",kuota_email_habis:"Tersimpan, tetapi kuota email harian habis.",email_tidak_valid_atau_domain_tidak_diizinkan:"Tersimpan, tetapi email tidak valid atau domainnya tidak diizinkan.",gagal_kirim:"Tersimpan, tetapi email gagal dikirim.",terlalu_sering:"Pengingat baru saja dikirim. Coba lagi nanti."};
function mailToast(m){toast(MM[m]||m)}
function mkDb(){
 let cb=null,eb=null,q=Promise.resolve();
 const persist=()=>{try{localStorage.setItem(K,JSON.stringify({rows,pics}))}catch(e){}};
 const emit=()=>{persist();cb&&cb({docs:rows.map(r=>({id:r.id,data:()=>r}))})};
 const post=async b=>{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(b)});const j=await r.json();if(!j.ok)throw new Error(j.error||"error");return j};
 const refresh=async()=>{
  if(fetching||pending)return;fetching=true;
  try{
   const tx=await(await fetch(API+"?a=list&t="+Date.now())).text();let j;
   try{j=JSON.parse(tx)}catch(e){diag("Web App tidak mengembalikan data. Awal respons: "+tx.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim().slice(0,100));throw 0}
   if(!j.ok){diag("Web App menolak permintaan: "+(j.error||"galat"));throw 0}
   if(!j.v||j.v<4)warnV(j.v);else if($("note").style.color){$("note").style.color="";$("note").textContent="Data tersambung ke Google Sheet dan diperbarui otomatis."}
   if(!pending){rows=j.rows;if(j.pics)pics=j.pics;emit()}
  }catch(e){eb&&eb()}finally{fetching=false}
 };
 const send=b=>{pending++;q=q.then(async()=>{for(let i=0;i<3;i++){try{const j=await post(b);if(b.action==="remind"){j.mail?mailToast(j.mail):toast("Pengingat terkirim ke "+(j.sent||0)+" PIC")}else if(j&&j.mail)mailToast(j.mail);return}catch(e){await new Promise(r=>setTimeout(r,700*(i+1)))}}toast("Gagal menyimpan ke Google Sheet. Data dimuat ulang.")}).then(()=>{pending--;if(!pending)refresh()})};
 const X=()=>{const x=xtra;xtra={};return x};const nid=()=>"n"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
 return{
  collection:()=>({
   add:async d=>{const id=nid();rows.push({...d,id});emit();send({action:"add",id,data:d,...X()})},
   onSnapshot:(f,e)=>{cb=f;eb=e;if(hadCache)emit();refresh();setInterval(()=>{if(!document.hidden)refresh()},30000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()})}
  }),
  doc:p=>{const id=p.split("/")[1];return{
   set:async d=>{rows=rows.map(r=>r.id===id?{...d,id}:r);emit();send({action:"set",id,data:d,...X()})},
   delete:async()=>{rows=rows.filter(r=>r.id!==id);emit();send({action:"delete",id})}}},
  remind:()=>send({action:"remind"}),
  replace:a=>{rows=a.map((r,i)=>({...r,id:nid()+i}));emit();send({action:"replace",rows})}
 };
}
const HDR=["Pekerjaan Utama","Nama Pekerjaan","Sub Bidang","PIC","Progress","Status","Tanggal Mulai","Due Date","Issue"];
const ALIAS={start:["tanggal mulai","mulai","start","start date","tgl mulai"],main:["pekerjaan utama","jenis pekerjaan","jenis","main"],name:["pekerjaan","nama pekerjaan","name","nama","title","judul"],sub:["sub bidang","subbidang","sub","bidang"],pic:["pic"],prog:["progress","progres","prog"],st:["status","st"],due:["due date","duedate","due","tenggat"],issue:["issue","kendala","masalah"]};
function toCSV(){
 const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
 return"\ufeff"+[HDR.map(q).join(";")].concat(jobs.map(j=>[j.main,j.name,j.sub,j.pic,j.prog,j.st,j.start,j.due,j.issue].map(q).join(";"))).join("\r\n");
}
function dl(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function parseCSV(t){
 t=t.replace(/^\ufeff/,"");
 const l0=t.split("\n")[0],d=[";",",","\t"].map(c=>[c,l0.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
 const R=[];let r=[],f="",q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;
  else if(c===d){r.push(f);f=""}
  else if(c==="\n"){r.push(f.replace(/\r$/,""));R.push(r);r=[];f=""}
  else f+=c}
 if(f!==""||r.length){r.push(f.replace(/\r$/,""));R.push(r)}
 return R.filter(x=>x.some(y=>y.trim()!==""));
}
function importCSV(text){
 const R=parseCSV(text);if(R.length<2){toast("File kosong atau tidak terbaca");return}
 const h=R[0].map(x=>x.trim().toLowerCase()),ix={};
 for(const k in ALIAS)ix[k]=h.findIndex(x=>ALIAS[k].includes(x));
 if(ix.name<0){toast("Kolom Pekerjaan tidak ditemukan di baris judul");return}
 const ST=["On Track","Berisiko","Terlambat","Selesai"],out=[];
 for(const r of R.slice(1)){
  const g=k=>ix[k]>=0?(r[ix[k]]||"").trim():"",name=g("name");if(!name)continue;
  const sv=g("sub").toLowerCase(),sub=SUBS.find(s=>s.toLowerCase()===sv)||SUBS.find(s=>sv&&s.toLowerCase().endsWith(sv.replace(/^perencanaan\s*/,"")))||SUBS[0];
  const stv=g("st").toLowerCase();
  out.push({main:g("main"),name,sub,pic:g("pic"),prog:Math.min(100,Math.max(0,parseInt(g("prog"))||0)),st:ST.find(s=>s.toLowerCase()===stv)||"On Track",start:normDue(g("start")),due:normDue(g("due")),issue:g("issue"),upd:todayS()});
 }
 if(!out.length){toast("Tidak ada baris data yang bisa diimpor");return}
 if(!confirm("Impor "+out.length+" pekerjaan? Data yang ada sekarang akan diganti."))return;
 db.replace(out);toast(out.length+" pekerjaan diimpor");
}
